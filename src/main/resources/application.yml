spring:
  datasource:
    url: jdbc:mysql://localhost:3306/paperwise?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.qq.com
    port: 587
    username: 379299583@qq.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      client-name: library-app
      lettuce:
        pool:
          enabled: true
          max-active: 100
          max-idle: 100
          min-idle: 0
          time-between-eviction-runs: 1m
jwt:
  secret: "${JWT_SECRET}"
  expiration: 604800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/*.xml
qianwen:
  apikey: ${DASHSCOPE_API_KEY}
  model: qwen-turbo
app:
  base-url: http://localhost:8080

knife4j:
  enable: true
  openapi:
    enable: true


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

kind: Application


