# api-governance starter（io.github.biglv666:0.5.0）：SecurityConfig 已删除（filterChain Bean 同名冲突源），
# 治理开启：本地令牌桶 + 管理端点 + Micrometer 桥接
api:
  governance:
    enabled: true
    log:
      slow-threshold-ms: 500
    rate-limit:
      type: local
      algorithm: token-bucket
      default-limit: -1          # 全局默认不限流，仅注解接口限流
      status-code: 429
      message: "请求过于频繁，请稍后重试"
    metrics:
      micrometer-enabled: true
    alert:
      enabled: true
      suppress-interval-ms: 5000
    management:
      enabled: true
      base-path: /api-governance

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/paperwise?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.qq.com
    port: 587
    username: 379299583@qq.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      client-name: library-app
      lettuce:
        pool:
          enabled: true
          max-active: 100
          max-idle: 100
          min-idle: 0
          time-between-eviction-runs: 1m
auth-kit:
  token:
    timeout: 7d          # 对齐原 jwt.expiration=604800000
    active-timeout: 1d   # 滑动续期：1 天无活动即失效
  session:
    max-sessions-per-device: 1   # 同端互斥顶号
  whitelist:                     # 与原 WebConfig 放行清单对齐
    - /paperwise/user/login
    - /api-governance/**
    - /paperwise/user/register
    - /paperwise/user/activation
    - /paperwise/share/**
    - /doc.html
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /swagger-resources/**
    - /webjars/**

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 必须是 true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开启 SQL 日志
  mapper-locations: classpath*:/Mapper/*.xml  # jar 内大小写敏感，必须匹配大写 Mapper 目录
qianwen:
  apikey: ${DASHSCOPE_API_KEY}
  model: qwen-turbo
app:
  base-url: http://localhost:8080

knife4j:
  enable: true
  openapi:
    enable: true


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
# application.yml
langchain4j:
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: qwen2.5:7b
      temperature: 0.7
      max-retries: 0          # 禁用重试
      timeout: 30s

kind: Application



# 声明式状态流转（io.github.biglv666:state-kit）：note_ai_organization 的 AI 整理状态唯一写入口
state-kit:
  machines:
    noteOrganize:
      state-type: org.example.paperwise.enums.NoteOrganizeStatus
      table: note_ai_organization
      status-column: status
      id-column: organization_id
      id-type: java.lang.Long
      conflict-strategy: throw
      transitions:
        - { from: PROCESSING, event: SUCCEED, to: SUCCESS }
        - { from: PROCESSING, event: FAIL,    to: FAILED }
